[package]
name = "orqen"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Local model-provider gateway for coding agents, with a scoped credential pool"
license = "MIT"
repository = "https://github.com/min9lin9/orqen"
homepage = "https://github.com/min9lin9/orqen"
readme = "README.md"
keywords = ["llm", "gateway", "proxy", "coding-agent", "openai"]
categories = ["command-line-utilities", "web-programming::http-server"]

[dependencies]
axum = "0.8"
bytes = "1"
futures-util = "0.3"
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-native-roots",
    "stream",
    "http2",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = "thin"
